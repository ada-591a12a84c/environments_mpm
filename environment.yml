name: mpm-lecture
channels: #tells conda within which channels to look for packages
  - conda-forge
  - nodefaults
dependencies: #specifies the packages to be installed in the environment
  - python=3.14
  - pip
  - numpy>=2.1
  - matplotlib>=3.10
  - pip: #specifies the pip packages to be installed in the environment
      - -e . # install local repo
